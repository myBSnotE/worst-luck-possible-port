name: probe

on:
  push:
    paths:
      - '.github/workflows/probe.yml'
      - 'tools/probe.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probe
        run: python tools/probe.py > probe/probe.log 2>&1 || true
      - name: Commit results
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A probe
          git commit -m "probe results" || echo "nothing to commit"
          git pull --rebase || true
          git push
