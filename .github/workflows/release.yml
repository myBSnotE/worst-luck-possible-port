name: Publish release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-v2.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v2.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.1 \
            dist/worst-luck-possible-2.0.1.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Worst Luck Possible 2.0.1 — adaptive hostile despawning" \
            --notes-file release-notes-v2.0.1.md
