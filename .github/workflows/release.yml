name: Publish release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-v2.0.3"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bilingual README
        run: |
          python3 tools/update_readme_v2_0_3.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git commit -m "document zero-durability fishing boots"
          git push
      - name: Publish v2.0.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          gh release create v2.0.3 \
            dist/worst-luck-possible-2.0.3.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Worst Luck Possible 2.0.3 — depleted fishing boots" \
            --notes-file release-notes-v2.0.3.md
