name: Publish release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-v2.1.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bilingual README
        run: |
          python3 tools/update_readme_v2_1_1.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git commit -m "document nearby skeleton horse traps"
          git push
      - name: Publish v2.1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          gh release create v2.1.1 \
            dist/worst-luck-possible-2.1.1.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Worst Luck Possible 2.1.1 — nearby skeleton horse traps" \
            --notes-file release-notes-v2.1.1.md
