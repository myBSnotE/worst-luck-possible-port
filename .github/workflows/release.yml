name: Publish release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-v2.0.2-retry"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bilingual README
        run: |
          python3 tools/update_readme_v2_0_2.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git commit -m "document forced leather-boot fishing and debug commands"
          git push
      - name: Publish v2.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          gh release create v2.0.2 \
            dist/worst-luck-possible-2.0.2.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Worst Luck Possible 2.0.2 — leather-boot fishing" \
            --notes-file release-notes-v2.0.2.md
