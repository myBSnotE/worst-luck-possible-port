name: Publish release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-v2.0.4"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bilingual README
        run: |
          python3 tools/update_readme_v2_0_4.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git commit -m "document zombie reinforcement safety cap"
          git push
      - name: Publish v2.0.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          gh release create v2.0.4 \
            dist/worst-luck-possible-2.0.4.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Worst Luck Possible 2.0.4 — reinforcement safety cap" \
            --notes-file release-notes-v2.0.4.md
