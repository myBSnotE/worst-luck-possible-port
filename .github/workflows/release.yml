name: Publish release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-v2.4.0-beta.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v2.4.0-beta.1 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          gh release create v2.4.0-beta.1 \
            dist/worst-luck-possible-2.4.0-beta.1.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Worst Luck Possible 2.4.0-beta.1" \
            --notes-file release-notes/release-notes-v2.4.0-beta.1.md \
            --prerelease
