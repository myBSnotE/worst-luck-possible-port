name: Publish prerelease

on:
  push:
    branches: [main]
    paths:
      - ".github/release-v2.2.0-beta.3"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bilingual README
        run: |
          python3 tools/update_readme_v2_2_0_beta_3.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "document recurring raid witch refills"
            git push
          fi
      - name: Publish v2.2.0-beta.3 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          gh release create v2.2.0-beta.3 \
            dist/worst-luck-possible-2.2.0-beta.3.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Worst Luck Possible 2.2.0-beta.3 — recurring raid witch refills" \
            --notes-file release-notes-v2.2.0-beta.3.md \
            --prerelease
